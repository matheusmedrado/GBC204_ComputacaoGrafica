.19,175.39Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge0"><rect x="42.5" y="115.25" width="186.85" height="72" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="135.93" y="129.15">aperta o mouse com Linha,</tspan><tspan x="135.93" y="147.15">Retângulo, Círculo ou</tspan><tspan x="135.93" y="165.15">Selecionar, ou marca o</tspan><tspan x="135.93" y="183.15">primeiro vértice do Polígono</tspan></text></g><g class="pele-edge-label" data-id="edge1"><rect x="656.11" y="10" width="179.53" height="72" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="745.88" y="23.9">Esc, Ctrl+Z, N ou troca de</tspan><tspan x="745.88" y="41.9">ferramenta com o polígono</tspan><tspan x="745.88" y="59.9">aberto (</tspan><tspan font-family="var(--_fm)">cancel</tspan><tspan>), ou área</tspan><tspan x="745.88" y="77.9">vazia no Selecionar</tspan></text></g><g class="pele-edge-label" data-id="edge2"><rect x="424.55" y="238.5" width="186.63" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="517.86" y="252.4">solta o mouse (</tspan><tspan font-family="var(--_fm)">release</tspan><tspan>) ou</tspan><tspan x="517.86" y="270.4">fecha o polígono (</tspan><tspan font-family="var(--_fm)">enter</tspan><tspan>)</tspan></text></g><g class="pele-edge-label" data-id="edge3"><rect x="645.11" y="311" width="201.54" height="90" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="745.88" y="324.9">setas e Mover (</tspan><tspan font-family="var(--_fm)">translation</tspan><tspan>)</tspan><tspan x="745.88" y="342.9">Q e E (</tspan><tspan font-family="var(--_fm)">rotation</tspan><tspan>)</tspan><tspan x="745.88" y="360.9">+ e − (</tspan><tspan font-family="var(--_fm)">scale</tspan><tspan>)</tspan><tspan x="745.88" y="378.9">cor, espessura e vazado,</tspan><tspan x="745.88" y="396.9">menos na área do Selecionar</tspan></text></g><g class="pele-edge-label" data-id="edge4"><rect x="873.58" y="133.75" width="158.51" height="90" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="952.83" y="147.65">Enter, N, S, botão Fixar,</tspan><tspan x="952.83" y="165.65">novo clique no canvas</tspan><tspan x="952.83" y="183.65">ou troca de ferramenta.</tspan><tspan x="952.83" y="201.65">Com o Mover, só clique</tspan><tspan x="952.83" y="219.65">fora da moldura</tspan></text></g><g class="pele-edge-label" data-id="edge5"><rect x="875.71" y="294.75" width="154.24" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="952.83" y="308.65">Delete, Backspace,</tspan><tspan x="952.83" y="326.65">botão Apagar ou Ctrl+Z</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-state purple" data-id="Previa" transform="translate(330.45,151.25)"><rect x="-73.6" y="-31" width="147.2" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Prévia</tspan><tspan x="0" y="16.1" font-family="var(--_fm)">Tool.preview</tspan></text></g><g class="pele-node pele-state blue" data-id="Solta" transform="translate(745.88,256.5)"><rect x="-107.2" y="-31" width="214.4" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Solta por cima do canvas</tspan><tspan x="0" y="16.1" font-family="var(--_fm)">MiniPaint.selection</tspan></text></g><g class="pele-node pele-state teal" data-id="Fixada" transform="translate(1200.39,178.75)"><rect x="-140.8" y="-31" width="281.6" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Fixada no canvas</tspan><tspan x="0" y="16.1" font-family="var(--_fm)">MiniPaint.commit_selection</tspan></text></g><g class="pele-